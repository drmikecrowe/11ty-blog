baseURL = 'https://mikesshinyobjects.tech/'
locale = 'en-us'
title = "Mike's Shiny Objects"
theme = 'ananke'

[params]
  author = "Mike Crowe"
  description = "Thoughts, Solutions, Creations and my Ah-Ha moments"
  hero = "/images/home/hero.webp"
  favicon = "/favicon.ico"
  featured_image = "/images/home/hero.webp"

[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/"
    weight = 1

  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts"
    weight = 2

  [[menu.main]]
    identifier = "watching"
    name = "Watching"
    url = "/watching"
    weight = 3

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  codeFences = false

# Production settings
enableRobotsTXT = true
canonifyURLs = true

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

# Disable tag/category pages from sitemap (they often get flagged as thin content)
[taxonomies]
  tag = "tags"
  category = "categories"
  genre = "genres"
  media_type = "media_types"

# Set lower priority for taxonomy pages
[[cascade]]
  [cascade.target]
    kind = "term"
  [cascade.sitemap]
    priority = 0.3

[[cascade]]
  [cascade.target]
    kind = "taxonomy"
  [cascade.sitemap]
    priority = 0.1

paginate = 10

[params.ananke.social.follow]
new_window_icon = false
networks = [
  "bluesky",
  "medium",
  "linkedin",
  "github",
  "rss"
]

[params.ananke.social.linkedin]
username = "mwcrowe"

[params.ananke.social.bluesky]
username = "drmikecrowe.net"

[params.ananke.social.medium]
username = "drmikecrowe"

[params.ananke.social.github]
username = "drmikecrowe"

[params.ananke.social.rss]
profilelink = "/index.xml"

[deployment]
[[deployment.targets]]
name = "prod"
url = "s3://mikesshinyobjects.tech"
cloudFrontDistributionID = "E230DHNOI4UQRZ"
