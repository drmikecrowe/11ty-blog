{{ define "main" }}
  <article class="pa3 pa4-ns nested-copy-line-height">
    <section class="cf ph3 ph5-l pv3 pv4-l f4 tc-l center measure-wide lh-copy nested-links {{ $.Param "text_color" | compare.Default "mid-gray" }}">
      {{- .Content -}}
    </section>

    <section class="mt5 ph3 ph5-l">
      <div class="flex flex-wrap nl2 nr2">
        {{ $pages := where .Site.RegularPages "Section" "watching" }}
        {{ $pages = where $pages "Kind" "page" }}
        {{ range $pages.ByDate.Reverse }}
          {{ if (findRE "/watching/tv/" .Permalink) }}
          <div class="w-50 w-third-m w-20-l pa2">
            {{ .Render "poster-card" }}
          </div>
          {{ end }}
        {{ end }}
      </div>
    </section>
  </article>
{{ end }}
