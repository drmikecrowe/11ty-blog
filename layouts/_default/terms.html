{{ define "main" }}
  <article class="cf pa3 pa4-m pa4-l">
    <div class="measure-wide-l center f4 lh-copy nested-copy-line-height nested-links {{ $.Param "text_color" | compare.Default "mid-gray" }}">
      <h1 class="f2 fw1">{{ .Title }}</h1>
      {{ with .Content }}
        <div class="mv3">
          {{- . -}}
        </div>
      {{ end }}
      {{ if eq .Title "Genres" }}
        <p>Browse movies and TV shows by genre.</p>
      {{ end }}
    </div>
    <div class="mw8 center ph3">
      <section class="flex flex-wrap mt4">
        {{ range .Data.Terms.Alphabetical }}
        <a href="{{ .Page.Permalink }}" class="f4 link dim ba b--moon-gray ph3 pv2 mb2 mr2 dib gray bg-near-white hover-bg-moon-gray">
          {{ .Page.Title }} <span class="f6">({{ .Count }})</span>
        </a>
        {{ end }}
      </section>
    </div>
  </article>
{{ end }}
